version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:14
    container_name: usergen-postgres
    environment:
      POSTGRES_DB: usergen_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - usergen-network

  redis:
    image: redis:7-alpine
    container_name: usergen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - usergen-network

  mongodb:
    image: mongo:6
    container_name: usergen-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: usergen_metadata
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - usergen-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: usergen-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - usergen-network

  # Microservices
  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: usergen-auth-service
    environment:
      - NODE_ENV=local
      - SERVICE_NAME=auth-service
      - SERVICE_PORT=3000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/usergen_auth
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - usergen-network
    volumes:
      - ./logs:/app/logs

  iam-service:
    build:
      context: ./microservices/iam-service
      dockerfile: Dockerfile
    container_name: usergen-iam-service
    environment:
      - NODE_ENV=local
      - SERVICE_NAME=iam-service
      - SERVICE_PORT=3005
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/usergen_iam
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    ports:
      - "3005:3005"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - usergen-network
    volumes:
      - ./logs:/app/logs

  workspace-service:
    build:
      context: ./microservices/workspace-service
      dockerfile: Dockerfile
    container_name: usergen-workspace-service
    environment:
      - NODE_ENV=local
      - SERVICE_NAME=workspace-service
      - SERVICE_PORT=3001
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/usergen_workspaces
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:3000
      - IAM_SERVICE_URL=http://iam-service:3005
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - auth-service
      - iam-service
    networks:
      - usergen-network
    volumes:
      - ./logs:/app/logs

  payment-wallet-service:
    build:
      context: ./microservices/payment-wallet-service
      dockerfile: Dockerfile
    container_name: usergen-payment-wallet-service
    environment:
      - NODE_ENV=local
      - SERVICE_NAME=payment-wallet-service
      - SERVICE_PORT=3002
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/usergen_payments
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:3000
      - WORKSPACE_SERVICE_URL=http://workspace-service:3001
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - auth-service
      - workspace-service
    networks:
      - usergen-network
    volumes:
      - ./logs:/app/logs

  activity-service:
    build:
      context: ./microservices/activity-service
      dockerfile: Dockerfile
    container_name: usergen-activity-service
    environment:
      - NODE_ENV=local
      - SERVICE_NAME=activity-service
      - SERVICE_PORT=3003
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/usergen_activities
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    ports:
      - "3003:3003"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - usergen-network
    volumes:
      - ./logs:/app/logs

  ai-content-service:
    build:
      context: ./microservices/ai-content-service
      dockerfile: Dockerfile
    container_name: usergen-ai-content-service
    environment:
      - NODE_ENV=local
      - SERVICE_NAME=ai-content-service
      - SERVICE_PORT=3004
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/usergen_ai_content
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://admin:password@mongodb:27017/usergen_metadata
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    ports:
      - "3004:3004"
    depends_on:
      - postgres
      - redis
      - mongodb
      - rabbitmq
      - payment-wallet-service
    networks:
      - usergen-network
    volumes:
      - ./logs:/app/logs

  # API Gateway (Kong)
  kong:
    image: kong:3.0
    container_name: usergen-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./infrastructure/kong/kong.yml:/kong/kong.yml
    depends_on:
      - auth-service
      - workspace-service
      - payment-wallet-service
      - activity-service
      - ai-content-service
    networks:
      - usergen-network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  rabbitmq_data:

networks:
  usergen-network:
    driver: bridge
