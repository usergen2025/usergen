_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:9000
    routes:
      - name: auth-routes
        paths:
          - /api/auth
        methods:
          - GET
          - POST
        plugins:
          - name: cors
            config:
              origins:
                - http://localhost:3200
                - http://localhost:9000
                - http://localhost:9001
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
                - X-Request-ID
              credentials: true
          - name: rate-limiting
            config:
              minute: 100
              hour: 1000
              policy: local

  - name: iam-service
    url: http://iam-service:9010
    routes:
      - name: iam-routes
        paths:
          - /api/permissions
          - /api/roles
          - /api/policies
          - /api/access
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        plugins:
          - name: cors
          - name: rate-limiting
            config:
              minute: 200
              hour: 2000
              policy: local

  - name: workspace-service
