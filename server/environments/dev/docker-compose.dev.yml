# Docker Compose file for development environment
# Note: All paths are relative to this file location (environments/dev/)
# Services run directly on host machine with PM2 (same as local setup)

services:
  # Databases
  postgres:
    image: postgres:14
    container_name: usergen-postgres-dev
    environment:
      POSTGRES_DB: usergen_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ../../infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - usergen-network-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: usergen-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - usergen-network-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: usergen-mongodb-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: usergen_metadata
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - usergen-network-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: usergen-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    networks:
      - usergen-network-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservices (commented out for dev environment - run with PM2)
  # Services run directly on host machine for easier development
  # Uncomment when you want to run services in Docker
  #
  # auth-service:
  #   build:
  #     context: ../../microservices/auth-service
  #     dockerfile: Dockerfile
  #   container_name: usergen-auth-service-dev
  #   environment:
  #     - NODE_ENV=development
  #     - SERVICE_NAME=auth-service
  #     - SERVICE_PORT=9000
  #     - DATABASE_URL=postgresql://postgres:password@postgres:5432/usergen_auth
  #     - REDIS_URL=redis://redis:6379
  #     - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
  #   ports:
  #     - "9000:9000"
  #   depends_on:
  #     - postgres
  #     - redis
  #     - rabbitmq
  #   networks:
  #     - usergen-network-dev
  #   volumes:
  #     - ../../logs:/app/logs

  # API Gateway (Kong) - Optional for dev environment
  # Uncomment when you want to use API Gateway
  #
  # kong:
  #   image: kong:3.0
  #   container_name: usergen-kong-dev
  #   environment:
  #     KONG_DATABASE: "off"
  #     KONG_DECLARATIVE_CONFIG: /kong/kong.yml
  #     KONG_PROXY_ACCESS_LOG: /dev/stdout
  #     KONG_ADMIN_ACCESS_LOG: /dev/stdout
  #     KONG_PROXY_ERROR_LOG: /dev/stderr
  #     KONG_ADMIN_ERROR_LOG: /dev/stderr
  #     KONG_ADMIN_LISTEN: 0.0.0.0:8001
  #   ports:
  #     - "8000:8000"
  #     - "8001:8001"
  #   volumes:
  #     - ../../infrastructure/kong/kong.yml:/kong/kong.yml
  #   networks:
  #     - usergen-network-dev

volumes:
  postgres_data_dev:
  redis_data_dev:
  mongodb_data_dev:
  rabbitmq_data_dev:

networks:
  usergen-network-dev:
    driver: bridge
