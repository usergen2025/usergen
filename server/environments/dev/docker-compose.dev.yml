# Docker Compose file for development environment
# Note: All paths are relative to this file location (environments/dev/)

services:
  # Databases
  postgres:
    image: postgres:14
    container_name: usergen-postgres-dev
    environment:
      POSTGRES_DB: usergen_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ../../infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - usergen-network-dev
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: usergen-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - usergen-network-dev
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  mongodb:
    image: mongo:6
    container_name: usergen-mongodb-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: dev_password
      MONGO_INITDB_DATABASE: usergen_metadata
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - usergen-network-dev

  rabbitmq:
    image: rabbitmq:3-management
    container_name: usergen-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: dev_user
      RABBITMQ_DEFAULT_PASS: dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    networks:
      - usergen-network-dev

  # Microservices
  auth-service:
    build:
      context: ../../microservices/auth-service
      dockerfile: Dockerfile
    container_name: usergen-auth-service-dev
    environment:
      - NODE_ENV=development
      - SERVICE_NAME=auth-service
      - SERVICE_PORT=9000
      - DATABASE_URL=postgresql://dev_user:dev_password@postgres:5432/usergen_auth
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://dev_user:dev_password@rabbitmq:5672
    ports:
      - "9000:9000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - usergen-network-dev
    volumes:
      - ../../logs:/app/logs
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  ai-content-service:
    build:
      context: ../../microservices/ai-content-service
      dockerfile: Dockerfile
    container_name: usergen-ai-content-service-dev
    environment:
      - NODE_ENV=development
      - SERVICE_NAME=ai-content-service
      - SERVICE_PORT=9001
      - DATABASE_URL=postgresql://dev_user:dev_password@postgres:5432/usergen_ai_content
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://admin:dev_password@mongodb:27017/usergen_metadata
      - RABBITMQ_URL=amqp://dev_user:dev_password@rabbitmq:5672
    ports:
      - "9001:9001"
    depends_on:
      - postgres
      - redis
      - mongodb
      - rabbitmq
    networks:
      - usergen-network-dev
    volumes:
      - ../../logs:/app/logs
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # API Gateway (Kong)
  kong:
    image: kong:3.0
    container_name: usergen-kong-dev
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ../../infrastructure/kong/kong.yml:/kong/kong.yml
    depends_on:
      - auth-service
      - ai-content-service
    networks:
      - usergen-network-dev

volumes:
  postgres_data_dev:
  redis_data_dev:
  mongodb_data_dev:
  rabbitmq_data_dev:

networks:
  usergen-network-dev:
    driver: bridge
